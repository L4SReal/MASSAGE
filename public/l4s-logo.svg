<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" fill="none">
  <!-- Modern Dark Rounded Emblem -->
  <rect x="2" y="2" width="48" height="48" rx="8" fill="#121214" stroke="#c5a059" stroke-width="1.5"/>
  
  <!-- Stylized Geometric L4S Monogram -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- L shape: Vertical stem and bottom base -->
    <path d="M12 14v22h10" stroke="#fcfbf8" stroke-width="3" />
    
    <!-- 4 shape: Diagonal, crossbar, and vertical stem -->
    <path d="M26 14l-7 14h12" stroke="#c5a059" stroke-width="2.5" />
    <path d="M27 18v18" stroke="#c5a059" stroke-width="2.5" />
    
    <!-- S shape: Interlocking modern sweeps -->
    <path d="M40 16h-7a3 3 0 0 0-3 3v2a3 3 0 0 0 3 3h4a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-8" stroke="#fcfbf8" stroke-width="2.6" />
  </g>
  
  <!-- Brand Wordmark Typography -->
  <g transform="translate(60, 0)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="900" letter-spacing="2.4" fill="#241a15">
      LICENSE<tspan fill="#c5a059">4</tspan>SITES
    </text>
    <text x="1" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="2.2" fill="#78716c">
      WEB DESIGN STUDIO
    </text>
  </g>
</svg>
